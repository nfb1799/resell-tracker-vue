name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Type-checks with vue-tsc, then builds.
      - run: npm run build
      # The browser's own installability check (Lighthouse no longer has one) and an
      # offline load, on the Chrome the runner already has.
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chrome

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # The integration tests run against a real SQL Server. Each run creates its own
    # database through the migrations and drops it afterwards.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          # A throwaway container that exists only for this job.
          MSSQL_SA_PASSWORD: Ci-Only-Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci-Only-Passw0rd -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      RESELLTRACKER_TEST_SQL: Server=localhost,1433;User Id=sa;Password=Ci-Only-Passw0rd;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json

      - run: dotnet restore
      # Style and analyzer rules; warnings are errors (Directory.Build.props).
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore --configuration Release
      # Domain tests, then API integration tests against the container above.
      - run: dotnet test --no-build --configuration Release
      # The model and the migrations must agree; a model change without a migration fails here.
      - run: dotnet tool restore && dotnet ef migrations has-pending-model-changes --project src/ResellTracker.Api --no-build --configuration Release

  # The production image: the API serving the built SPA. Built on every push and
  # pull request so a broken Dockerfile fails CI; pushed only from main.
  image:
    needs: [client, server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.name.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - id: name
        # Registry paths must be lower case.
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ${{ steps.name.outputs.ref }}:${{ github.sha }}
            ${{ steps.name.outputs.ref }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Rolls the new image out to Azure Container Apps, then checks the live site:
  # that it answers, and that the browser still finds it installable. Runs once
  # the repository variables from infra/azure-setup.sh are in place.
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      # Signs in to Azure with GitHub's short-lived OIDC token: no Azure password is stored.
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the new image
        run: >
          az containerapp update
          --name "${{ vars.AZURE_CONTAINER_APP }}"
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --image "${{ needs.image.outputs.ref }}:${{ github.sha }}"

      - name: Wait for the site to answer
        # A cold start (scaled to zero, database paused) can take a minute or two.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.APP_URL }}/api/health"; then exit 0; fi
            sleep 10
          done
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Check the live site is installable and opens offline
        working-directory: client
        run: |
          npm ci
          npm run test:e2e
        env:
          BASE_URL: ${{ vars.APP_URL }}
          PLAYWRIGHT_CHANNEL: chrome
